name: Test and create pull request
on:
  push:
    branches:
      - develop

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests and build fat jar
        run: ./gradlew build --no-daemon

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: review-service-jar
          path: build/libs/*.jar
          retention-days: 7

  create-pull-request:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open pr from develop to master
        env:
          GH_TOKEN: ${{github.token}}
          GH_REPO: ${{github.repository}}
        run: |
          open_prs=$(gh pr list --head develop --base master --state open --json number --jq 'length')
          if [ "$open_prs" -eq 0 ]; then
            gh pr create \
              --head develop \
              --base master \
              --title "Merge develop into master" \
              --body "Tests passed. Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "A PR from develop to master is already open. Skipping."
          fi